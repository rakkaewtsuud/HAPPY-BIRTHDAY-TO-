<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together For ...</title>
    
    <link rel="apple-touch-icon" href="logoAK.PNG">
    <link rel="icon" type="image/png" href="logoAK.PNG">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%); color: #555555; min-height: 100vh; overflow-x: hidden; position: relative; }

        /* ปรับสไตล์รูปให้คงที่ */
        .polaroid-card { background: white; padding: 10px; border-radius: 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 120px; transition: transform 0.3s; position: relative; }
        .polaroid-card img { width: 100%; height: 100px; object-fit: cover; border-radius: 2px; display: block; }
        .heart-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        
        /* สไตล์ที่เหลือคงเดิม */
        #landing { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #ffb199 0%, #ff0844 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; transition: opacity 0.8s ease; color: white; text-align: center; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; display: none; opacity: 0; transition: opacity 1s ease; }
        .container.show { opacity: 1; }
        .btn-open { background: white; color: #ff5277; border: none; padding: 15px 40px; font-size: 1.2rem; font-weight: 600; border-radius: 50px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="landing">
        <h1>Happy Anniversary ❤️</h1>
        <button class="btn-open" onclick="openWebsite()">กดตรงนี้เพื่อเปิดดูความทรงจำ 💖</button>
    </div>

    <div class="container" id="mainContent">
        <header><h2>Happy Anniversary to My Love ✨</h2></header>

        <!-- Gallery ตามแพทเทิร์น 2, 2, 7, 5, 3, 1 -->
        <div class="gallery-section">
            <div class="heart-shape-container">
                <div class="heart-row"><!-- 2 -->
                    <div class="polaroid-card"><img src="IMG_0247.jpeg" loading="lazy"></div>
                    <div class="polaroid-card"><img src="IMG_0482.jpeg" loading="lazy"></div>
                </div>
                <div class="heart-row"><!-- 2 -->
                    <div class="polaroid-card"><img src="IMG_1132.jpeg" loading="lazy"></div>
                    <div class="polaroid-card"><img src="IMG_1734.jpeg" loading="lazy"></div>
                </div>
                <div class="heart-row"><!-- 7 -->
                    <div class="polaroid-card"><img src="IMG_1736.jpeg" loading="lazy"></div>
                    <div class="polaroid-card"><img src="IMG_2260.jpeg" loading="lazy"></div>
                    <div class="polaroid-card"><img src="IMG_5718.jpeg" loading="lazy"></div>
                    <div class="polaroid-card"><img src="IMG_5729.jpeg" loading="lazy"></div>
                    <div class="polaroid-card"><img src="IMG_6829.jpeg" loading="lazy"></div>
                    <div class="polaroid-card"><img src="IMG_8720.jpeg" loading="lazy"></div>
                    <div class="polaroid-card"><img src="IMG_8884.jpeg" loading="lazy"></div>
                </div>
                <div class="heart-row"><!-- 5 -->
                    <div class="polaroid-card"><img src="IMG_8910.jpeg" loading="lazy"></div>
                    <div class="polaroid-card"><img src="IMG_9557.jpeg" loading="lazy"></div>
                    <div class="polaroid-card"><img src="IMG_0247.jpeg" loading="lazy"></div>
                    <div class="polaroid-card"><img src="IMG_0482.jpeg" loading="lazy"></div>
                    <div class="polaroid-card"><img src="IMG_1132.jpeg" loading="lazy"></div>
                </div>
                <div class="heart-row"><!-- 3 -->
                    <div class="polaroid-card"><img src="IMG_1734.jpeg" loading="lazy"></div>
                    <div class="polaroid-card"><img src="IMG_1736.jpeg" loading="lazy"></div>
                    <div class="polaroid-card"><img src="IMG_2260.jpeg" loading="lazy"></div>
                </div>
                <div class="heart-row"><!-- 1 -->
                    <div class="polaroid-card"><img src="IMG_5718.jpeg" loading="lazy"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openWebsite() {
            const landing = document.getElementById('landing');
            const mainContent = document.getElementById('mainContent');
            landing.style.opacity = '0';
            landing.style.visibility = 'hidden';
            setTimeout(() => {
                landing.style.display = 'none';
                mainContent.style.display = 'block';
                setTimeout(() => mainContent.classList.add('show'), 50);
            }, 800);
        }
    </script>
</body>
</html>
